name: aws-iac

# Order 25: offline checks of deploy/aws (VERIFIED_STATIC and TESTED_LOCAL). No AWS credential exists here: the workflow requests no
# OIDC token, runs no plan against a backend and no apply, and every Terraform test uses a mocked provider. The offline evaluator,
# static guards and cost checks also run inside `pnpm run verify` (tools/test/aws-infrastructure.test.mjs).

on:
  push:
    branches: [main]
    paths: ["deploy/aws/**", ".github/workflows/aws-iac.yml", "tools/test/aws-infrastructure.test.mjs"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["deploy/aws/**", ".github/workflows/aws-iac.yml", "tools/test/aws-infrastructure.test.mjs"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iac:
    name: iac (${{ matrix.tool }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned binaries, verified against the publisher's SHA256SUMS before use.
          - tool: tofu
            url: https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip
            sha256: 8ccbc6f8ee21d2827715f3c6e08a9b3e0209b1e62057c05067ef117e047c1a80
            lock: .terraform.lock.hcl
          - tool: terraform
            url: https://releases.hashicorp.com/terraform/1.16.5/terraform_1.16.5_linux_amd64.zip
            sha256: 2bc2fcfff033265c9e02ca0351f01794eb122f62a9b2a49a3294b9e49eaab5e4
            lock: terraform-registry.lock.hcl
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Install ${{ matrix.tool }} (pinned, checksum verified)
        env:
          URL: ${{ matrix.url }}
          SHA256: ${{ matrix.sha256 }}
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/tool.zip" "$URL"
          echo "$SHA256  $RUNNER_TEMP/tool.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/tool.zip" "$TOOL" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Format
        run: ${{ matrix.tool }} fmt -check -recursive -diff deploy/aws/terraform

      - name: Init (no backend, locked providers), validate and test every root and tested module
        env:
          TOOL: ${{ matrix.tool }}
          LOCK: ${{ matrix.lock }}
          TF_IN_AUTOMATION: "1"
        run: |
          set -euo pipefail
          for dir in accounts/management accounts/data accounts/workload modules/protected-bucket modules/database modules/network; do
            echo "::group::$dir"
            cd "deploy/aws/terraform/$dir"
            if [ "$LOCK" != ".terraform.lock.hcl" ]; then cp "$LOCK" .terraform.lock.hcl; fi
            "$TOOL" init -backend=false -input=false -lockfile=readonly
            "$TOOL" validate
            "$TOOL" test
            cd - > /dev/null
            echo "::endgroup::"
          done

  checkov:
    name: checkov
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Checkov (pinned), with the reviewed exceptions of deploy/aws/terraform/.checkov.yaml
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet checkov==3.3.26
          "$RUNNER_TEMP/venv/bin/checkov" --config-file deploy/aws/terraform/.checkov.yaml -d deploy/aws/terraform
