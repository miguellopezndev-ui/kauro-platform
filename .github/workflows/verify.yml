name: verify

on:
  push:
    branches: [main]
  # Draft PRs run nothing (a draft cannot merge). `labeled` exists so that adding the `windows` label to the final candidate
  # runs the Windows leg on its exact head (owner D-03, 2026-10-05); every label event reruns all the head's legs (see plan).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which legs run (owner D-03, 2026-10-05): ubuntu on every non-draft PR head; Windows only on main, on dispatch, and on a PR
  # that carries the `windows` label (the final candidate). On an ordinary PR the required context `verify (windows-latest)`
  # therefore does not report and the PR cannot merge until its final head has a real Windows success: a skipped leg never
  # stands in for a green one.
  plan:
    name: plan
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          HAS_WINDOWS_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'windows') }}
        run: |
          set -eu
          ubuntu='{"os":"ubuntu-24.04","pgbin":"/usr/lib/postgresql/17/bin"}'
          windows='{"os":"windows-latest","pgbin":"C:/pgsql17/pgsql/bin"}'
          # Every PR run carries ALL legs required for its head: GitHub evaluates a PR's required checks on the LATEST run of
          # this workflow for the head, so a run with fewer legs (e.g. a label event) would leave a required context "expected".
          if [ "$EVENT" != pull_request ] || [ "$HAS_WINDOWS_LABEL" = true ]; then legs="$ubuntu,$windows"; else legs="$ubuntu"; fi
          echo "include=[$legs]" >> "$GITHUB_OUTPUT"
          echo "legs: [$legs]"

  verify:
    name: verify (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.include != '[]'
    # No concurrency group: no run ever cancels another. GitHub judges a PR's required checks on the newest run of this
    # workflow for the head, and job scheduling order is not guaranteed, so any cross-run cancellation could cancel a leg of
    # that newest run. Cost only: superseded heads and duplicate label runs finish (they never vouch for another head).
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    env:
      PGBIN: ${{ matrix.pgbin }}
    defaults:
      run:
        shell: bash
    steps:
      # Byte-exact checkout on Windows too: digests and generated-file checks compare bytes.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      # Third-party actions are pinned to immutable commit SHAs.
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.16.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: pnpm

      # PostgreSQL 17 from the PGDG apt repository (Ubuntu 24.04 "noble"). Tests start and stop their own
      # ephemeral clusters as the runner user (packages/persistence/src/testing/temporary-postgres.ts) — this
      # step only makes the server and client binaries available on PGBIN, it does not run a shared server.
      - name: Install PostgreSQL 17 (PGDG)
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-17
          "$PGBIN/postgres" --version

      # PostgreSQL 17.6 (the version the owner measures with locally) from the EDB binaries zip; no service, the
      # tests start their own ephemeral clusters from PGBIN.
      - name: Install PostgreSQL 17 (EDB binaries)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri https://get.enterprisedb.com/postgresql/postgresql-17.6-1-windows-x64-binaries.zip -OutFile $env:RUNNER_TEMP\pg17.zip
          Expand-Archive -Path $env:RUNNER_TEMP\pg17.zip -DestinationPath C:\pgsql17
          & "$env:PGBIN/postgres.exe" --version

      # The report PDF tests (packages/data-plane/test/report-pdf.test.ts) run a real, SANDBOXED Chromium; with
      # KAURO_REQUIRE_PDF_ENGINE=1 a missing browser fails the suite instead of skipping it. The sandbox is never turned off. Ubuntu 24.04
      # restricts unprivileged user namespaces through AppArmor (kernel.apparmor_restrict_unprivileged_userns=1), which stops a browser
      # without an AppArmor profile from creating its namespace sandbox. This step first records what the host does, then (only if the
      # sandboxed browser really cannot start) installs a profile that grants `userns` to that one browser binary — the confinement
      # Ubuntu documents for Chrome — and probes again. If the sandboxed browser still cannot start, the job fails with the evidence.
      - name: Chromium for the PDF tests (Linux)
        if: runner.os == 'Linux'
        run: |
          set -u
          chrome=$(command -v google-chrome-stable || command -v google-chrome || true)
          [ -n "$chrome" ] || { echo "::error::no Google Chrome on the runner"; exit 1; }
          real=$(readlink -f "$chrome"); bin=/opt/google/chrome/chrome
          { echo "## Chromium for the PDF tests"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          report() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          report "runner: $(. /etc/os-release; echo "$PRETTY_NAME"), kernel $(uname -r), user $(id -un) (uid $(id -u))"
          report "executable: $chrome -> $real; binary $bin"
          report "version: $("$chrome" --version)"
          report "kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>&1)"
          report "kernel.unprivileged_userns_clone=$(sysctl -n kernel.unprivileged_userns_clone 2>&1)"
          report "unshare -U (plain user): $(unshare -U true 2>&1 && echo allowed || echo refused)"
          report "apparmor profiles naming chrome: $(sudo aa-status 2>/dev/null | grep -i chrome | tr '
' ' ' || true)"
          probe() {
            # the browser's own sandbox is on (no --no-sandbox); a refusal prints "No usable sandbox"
            timeout 60 "$chrome" --headless=new --disable-gpu --dump-dom about:blank > "$RUNNER_TEMP/chrome-probe.out" 2> "$RUNNER_TEMP/chrome-probe.err"
          }
          if probe; then
            report "sandboxed launch before any change: OK"
          else
            report "sandboxed launch before any change: REFUSED"; head -c 1500 "$RUNNER_TEMP/chrome-probe.err" | tee -a "$GITHUB_STEP_SUMMARY"
            # `userns` for this one binary only; the global restriction stays on for everything else
            sudo tee /etc/apparmor.d/kauro-chrome > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile kauro-chrome $bin flags=(unconfined) {
            userns,
            include if exists <local/kauro-chrome>
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/kauro-chrome
            report "installed an AppArmor profile granting userns to $bin only"
            if probe; then report "sandboxed launch with the profile: OK"
            else
              report "sandboxed launch with the profile: REFUSED"; head -c 1500 "$RUNNER_TEMP/chrome-probe.err" | tee -a "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"; echo "::error::the sandboxed Chromium cannot start on this runner; the sandbox is not disabled"; exit 1
            fi
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          { echo "KAURO_PDF_BROWSER=$chrome"; echo "KAURO_REQUIRE_PDF_ENGINE=1"; echo "KAURO_PDF_EVIDENCE_DIR=$GITHUB_WORKSPACE/pdf-evidence"; } >> "$GITHUB_ENV"

      - name: Chromium for the PDF tests (Windows)
        if: runner.os == 'Windows'
        run: |
          set -eu
          chrome="C:/Program Files/Google/Chrome/Application/chrome.exe"
          [ -f "$chrome" ] || { echo "::error::no Google Chrome on the runner"; exit 1; }
          echo "version: $(powershell -NoProfile -Command "(Get-Item '$chrome').VersionInfo.ProductVersion")"
          { echo "KAURO_PDF_BROWSER=$chrome"; echo "KAURO_REQUIRE_PDF_ENGINE=1"; echo "KAURO_PDF_EVIDENCE_DIR=$GITHUB_WORKSPACE/pdf-evidence"; } >> "$GITHUB_ENV"

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify (generate, build, typecheck, test, arch, openapi, web-client, matrix, clean-consume)
        run: |
          set -o pipefail
          pnpm run verify 2>&1 | tee verify.log

      - name: Upload evidence / test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-logs-${{ matrix.os }}
          path: |
            verify.log
            apps/api/openapi.json
            pdf-evidence/
            apps/web/src/api/generated.ts
            docs/design/B06-state-command-event-matrix.md
          if-no-files-found: warn
          retention-days: 14
